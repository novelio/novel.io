# Products listed on the home page, in display order. Each card shows a
# two-letter mark (`monogram`) in place of a logo; `mark` sets its colors:
# the tile, then the first and the second letter. An optional `ribbon`
# puts a short label, such as "beta", across the card's corner.
- name: uptime, plz!
  url: https://uptimeplz.com
  description: website uptime monitoring with moxie
  ribbon: beta
  monogram: up
  mark:
    background: "#0f1311"
    first: "#8bef6b"
    second: "#e0f4dc"
